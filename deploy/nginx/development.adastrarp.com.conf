# Vhost de development.adastrarp.com (Astra Dev, sitio estatico, blue/green).
#
# Se instala a mano UNA vez (docs/deploy/README.md):
#   sudo install -m 644 deploy/nginx/development.adastrarp.com.conf /etc/nginx/sites-available/development.adastrarp.com
#   sudo ln -s /etc/nginx/sites-available/development.adastrarp.com /etc/nginx/sites-enabled/
# El workflow solo avisa (::warning::) si el vivo difiere de este archivo.
# Si cambia el vivo a mano, reflejarlo aca el mismo dia.
#
# Las lineas `listen` copian las de adastrarp.com (adastra-site/nginx/adastrarp.conf).
# 127.0.0.1:443 es para el health check del deploy (curl --resolve).

# Docroot por request: `current` (slot vivo) salvo que el deploy, desde loopback,
# pida el slot ocioso con `X-Deploy-Slot: next`. Nadie mas puede ver el slot ocioso.
map "$remote_addr:$http_x_deploy_slot" $astra_dev_slot {
    default          current;
    "127.0.0.1:next" next;
    "::1:next"       next;
}

server {
    listen 80;
    listen [::]:80;
    server_name development.adastrarp.com;
    include /etc/nginx/snippets/wellknown.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 167.114.2.210:443 ssl;
    listen [2607:5300:205:200::716d]:443 ssl;
    listen 127.0.0.1:443 ssl;
    server_name development.adastrarp.com;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/wellknown.conf;

    ssl_certificate /etc/letsencrypt/live/development.adastrarp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/development.adastrarp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/development.adastrarp.com/$astra_dev_slot;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Health del deploy: debe llevar el sha del build. Nunca cacheado.
    # add_header en un location anula los del server: se repiten.
    location = /ready.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-store" always;
        try_files /ready.json =404;
    }

    # Assets de Vite con hash en el nombre: inmutables. Sin SPA fallback: un asset
    # que falta es 404, no el index.html.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html siempre revalidado para que un deploy se vea al toque.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
