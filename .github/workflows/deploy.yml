name: Deploy development.adastrarp.com

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a half-switched deploy.
concurrency:
  group: deploy-astra-dev
  cancel-in-progress: false

jobs:
  deploy:
    # adastra-org self-hosted runner (same labels as adastra-site).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate bun
        run: |
          set -eu
          if ! command -v bun >/dev/null 2>&1; then
            [ -x /opt/bun/bun ] || { echo "bun not found on the runner"; exit 1; }
            echo /opt/bun >> "$GITHUB_PATH"
          fi

      - name: Install, check and build
        run: |
          set -eu
          export PATH="/opt/bun:$PATH"
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)
          bun run check
          bun run build
          test -f dist/index.html

      - name: Build server bundle (API + semantic index)
        # The runner lives on the VPS, so the local embedder is reachable and the index is
        # semantic. If it is down the index is keyword-only: warn, the deploy still works.
        # Vectors computed off the VPS (PC or Cloudflare) and uploaded to
        # ~/deploy/index-prebuilt/ (index.json + index.vec) are reused for every chunk whose text
        # is unchanged, so the embedder only sees what changed. They are accepted only for the
        # models listed in the `development` environment variable EMBEDDER_ACCEPT_MODELS, which
        # gets a model only after `bun run embed:compat` passed for it (docs/import/README.md, 4b).
        # The bundle is only src + production deps + the index (docs/server/README.md).
        env:
          EMBEDDER_ACCEPT_MODELS: ${{ vars.EMBEDDER_ACCEPT_MODELS }}
        run: |
          set -eu
          export PATH="/opt/bun:$PATH"
          # Natives and fivem-docs at the shas pinned in content-sources.json (docs/import/README.md).
          bun run import
          prebuilt="$HOME/deploy/index-prebuilt/index.json"
          if [ -f "$prebuilt" ]; then
            echo "reusing vectors from $prebuilt"
            export REUSE_FROM="$prebuilt"
          fi
          (cd server && bun run index)
          rm -rf server-dist
          mkdir -p server-dist/data
          cp -r server/src server/package.json server/bun.lock server-dist/
          cp server/data/index.json server-dist/data/index.json
          # Semantic indexes carry their vectors in a sibling file (Float32).
          if grep -q '"semantic":true' server/data/index.json; then
            cp server/data/index.vec server-dist/data/index.vec
          fi
          (cd server-dist && bun install --frozen-lockfile --production)
          test -f server-dist/src/main.ts
          if ! grep -q '"semantic":true' server-dist/data/index.json; then
            echo "::warning::Docs index is keyword-only: the embedder was not reachable from the runner"
          fi

      - name: Check nginx vhost and systemd unit drift
        # The vhost and the user unit are installed by hand once (docs/deploy/README.md,
        # docs/server/README.md). This only warns when the live files differ from the repo copies.
        run: |
          live=/etc/nginx/sites-available/development.adastrarp.com
          if ! diff -q deploy/nginx/development.adastrarp.com.conf "$live" >/dev/null 2>&1; then
            echo "::warning::Live nginx vhost differs from deploy/nginx/development.adastrarp.com.conf (or is missing)"
          fi
          unit="$HOME/.config/systemd/user/astra-dev@.service"
          if ! diff -q deploy/systemd/astra-dev@.service "$unit" >/dev/null 2>&1; then
            echo "::warning::systemd user unit is not installed or differs from deploy/systemd/astra-dev@.service: the API stage is skipped until it is"
          fi

      - name: Deploy to idle slot, health check, switch
        # deploy/astra-dev.sh: copy dist to the idle slot, probe it through the real
        # vhost (sha in /ready.json), switch the `current` symlink, reload nginx, probe
        # again, roll back automatically if the post-switch probe fails.
        run: |
          set -eu
          export PATH="/opt/bun:$PATH"
          version=$(bun -e "console.log(require('./package.json').version)")
          install -m 755 deploy/astra-dev.sh /home/hermes/deploy/astra-dev.sh
          # 4th arg: the server bundle. The script skips the API stage (with a warning) when the
          # systemd user unit is not installed yet, so the static deploy keeps working.
          /home/hermes/deploy/astra-dev.sh deploy "$GITHUB_SHA" "$PWD/dist" "$version" "$PWD/server-dist"

      - name: Verify public domain
        id: verify
        # Real domain, real DNS, whatever sits in front of nginx. /ready.json must carry
        # this commit's sha (the SPA fallback would answer 200 for anything).
        run: |
          set -eu
          for _ in $(seq 1 15); do
            body=$(curl -fsS --max-time 10 https://development.adastrarp.com/ready.json 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "\"sha\":\"$GITHUB_SHA\""; then
              echo "public ok: $body"
              curl -fsS --max-time 10 -o /dev/null -w 'GET / -> %{http_code}\n' https://development.adastrarp.com/
              # API stage active (unit installed): /api/ready must carry the sha too.
              if [ -f "$HOME/.config/systemd/user/astra-dev@.service" ]; then
                api=$(curl -fsS --max-time 10 https://development.adastrarp.com/api/ready 2>/dev/null || true)
                if printf '%s' "$api" | grep -q "\"sha\":\"$GITHUB_SHA\""; then
                  echo "api ok: $api"
                else
                  echo "public /api/ready does not carry $GITHUB_SHA: last body: ${api:-<none>}"
                  exit 1
                fi
              fi
              exit 0
            fi
            sleep 4
          done
          echo "public /ready.json does not carry $GITHUB_SHA: last body: ${body:-<none>}"
          exit 1

      - name: Roll back on failed public verification
        # Only after the switch happened: a failed check/build must not flip the live slot.
        if: failure() && steps.verify.conclusion == 'failure'
        run: |
          /home/hermes/deploy/astra-dev.sh status || true
          /home/hermes/deploy/astra-dev.sh rollback || echo "rollback not possible (first deploy or no previous slot)"
