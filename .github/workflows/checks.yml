name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted runner on purpose: pull requests from forks must not run
    # code on the org's self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      # The server is its own Bun package (own lockfile); `bun run check` also checks it.
      - run: bun install --frozen-lockfile
        working-directory: server

      # typecheck + lint + format:check + test (same as local `bun run check`)
      - run: bun run check
